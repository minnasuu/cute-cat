server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- SSE / 流式接口（vibe-snap-extract、laisse-ancie/chat 等）必须关闭缓冲 ---
    # 正则匹配所有 SSE 端点：流式响应会在 AI 生成期间周期发送心跳注释行，
    # 必须关闭 proxy_buffering，否则 nginx 会缓冲到整块响应完成才转发 → 504。
    location ~ ^/api/(dify/vibe-snap-extract|laisse-ancie/chat|teams/[^/]+/chat) {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # 关键：关闭代理缓冲，让 SSE 心跳和数据帧实时到达客户端
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # --- 上传文件的静态资源代理 ---
    # 注意:不用 immutable —— 一旦 404 会被浏览器永久缓存,修复后仍显示 404。
    # 用较短 cache + must-revalidate,命中缓存快、出错也能回源重试。
    location /uploads/ {
        proxy_pass http://backend:8002/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # --- 设计图生成(Imagen)：单张可达百秒级,需要更长的读超时 ---
    # 覆盖: generate / regenerate / lineart / generate-final / recommend-materials
    # 统一 3 分钟(180s),与后端 IMAGE_TIMEOUT_MS 对齐,避免 nginx 先于后端 504
    location ~ ^/api/teams/[^/]+/design/(generate|regenerate|lineart|generate-final|recommend-materials) {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # --- 通用 API 代理 ---
    # proxy_read/send_timeout 取 180s,与生图 IMAGE_TIMEOUT_MS 对齐:
    # workflow 执行端点(/api/workflows/...)会触发猫脚本生图(pixel-image 等),
    # 低于 180s 会导致 nginx 先于后端 504。
    location /api/ {
        proxy_pass http://backend:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        # 普通 API 允许缓冲（提升小响应性能）
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        # 上传文件大小限制
        client_max_body_size 12m;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8002/health;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
